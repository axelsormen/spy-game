<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Axel's Spy Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e13;
    --panel: #141922;
    --panel-2: #1b2230;
    --line: #262f3f;
    --text: #e8ecf2;
    --muted: #8b95a7;
    --accent: #f5b301;
    --accent-ink: #1a1400;
    --danger: #ff4d5e;
    --radius: 18px;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(1000px 600px at 50% -15%, #1c2638 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 440px; margin: 0 auto; padding: 28px 16px 48px; }
  .hidden { display: none !important; }
  .screen { animation: fadeUp .35s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Brand */
  .brand { text-align: center; margin: 32px 0 36px; }
  .logo { font-size: 64px; font-weight: 700; letter-spacing: .32em; margin-right: -.32em; line-height: 1; }
  .logo span { color: var(--accent); }
  .tagline { color: var(--muted); margin-top: 10px; }
  .eye { width: 54px; height: 54px; margin: 0 auto 16px; color: var(--accent); }

  /* Panels & form */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin: 0 2px 8px; }
  input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    font: inherit; font-size: 18px; padding: 14px 16px; border-radius: 12px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,179,1,.15); }
  input::placeholder { color: #5b6577; }
  .code-input { font-family: var(--mono); text-transform: uppercase; letter-spacing: .4em; text-align: center; }
  .code-input::placeholder { letter-spacing: .1em; }

  .btn {
    display: block; width: 100%; border: 0; font: inherit; font-weight: 700; font-size: 18px;
    padding: 15px; border-radius: 12px; cursor: pointer;
    transition: transform .08s, filter .15s, opacity .15s, background .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:not(:disabled):hover { filter: brightness(1.08); }
  .btn-ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  .btn-ghost:hover { background: #222a3a; }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,77,94,.4); }
  .btn-danger:hover { background: rgba(255,77,94,.08); }
  .mt { margin-top: 12px; }

  .step { animation: fadeUp .3s ease; }
  .hello { text-align: center; color: var(--muted); margin-bottom: 16px; }
  .hello b { color: var(--text); }
  .link { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; margin-left: 6px; text-decoration: underline; text-underline-offset: 3px; }
  .choice {
    display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; color: var(--text); font: inherit; margin-bottom: 12px;
    transition: border-color .15s, transform .08s, background .15s;
  }
  .choice:hover { border-color: var(--accent); background: #171d28; }
  .choice:active { transform: scale(.99); }
  .choice-icon {
    width: 48px; height: 48px; border-radius: 14px; flex: none; display: grid; place-items: center;
    background: rgba(245,179,1,.12); color: var(--accent); font-family: var(--mono); font-size: 24px; font-weight: 700;
  }
  .choice-text { flex: 1; min-width: 0; }
  .choice-text b { display: block; font-size: 19px; }
  .choice-text small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .chev { color: var(--muted); font-size: 28px; line-height: 1; }
  .btn-text { background: none; color: var(--muted); font-weight: 500; font-size: 16px; padding: 8px; }
  .btn-text:hover { color: var(--text); }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px;
    text-transform: uppercase; letter-spacing: .12em; margin: 20px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  .row .btn { width: auto; padding: 0 22px; }

  /* Lobby */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .mini-logo { font-weight: 700; letter-spacing: .3em; font-size: 20px; }
  .mini-logo span { color: var(--accent); }
  .room-chip {
    display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 6px 6px 14px; cursor: pointer; color: var(--text); font: inherit;
  }
  .room-chip:hover { border-color: var(--accent); }
  .room-chip .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .room-chip .code { font-family: var(--mono); font-size: 18px; letter-spacing: .2em; font-weight: 700; }
  .room-chip .copy { background: var(--panel-2); border-radius: 999px; width: 30px; height: 30px; display: grid; place-items: center; }

  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 10px; }
  .section-head .label { margin: 0; }
  .count-pill { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .players { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .player {
    display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px; min-width: 0;
  }
  .player.new { animation: pop .25s ease;
  }
  .player.me { border-color: rgba(245,179,1,.45); }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; color: #fff; }
  .pinfo { min-width: 0; }
  .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .tag { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }

  .stepper { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .stepper .title { font-weight: 500; }
  .stepper .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ctrl { display: flex; align-items: center; gap: 12px; }
  .round-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); font-size: 22px; cursor: pointer; display: grid; place-items: center; line-height: 1;
  }
  .round-btn:hover:not(:disabled) { border-color: var(--accent); }
  .round-btn:disabled { opacity: .3; cursor: not-allowed; }
  .num { font-family: var(--mono); font-size: 28px; font-weight: 700; min-width: 28px; text-align: center; }
  .hint-line { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; }

  .waiting { text-align: center; color: var(--muted); padding: 22px 16px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: pulse 1.4s infinite; vertical-align: middle; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  /* Result */
  .result { text-align: center; margin-bottom: 20px; border-color: rgba(245,179,1,.35); }
  .result .country { font-size: 34px; font-weight: 700; margin: 4px 0 14px; }
  .pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .pill { background: rgba(255,77,94,.12); color: var(--danger); border: 1px solid rgba(255,77,94,.35); border-radius: 999px; padding: 4px 12px; font-weight: 500; }

  /* Game */
  .timer-wrap { position: relative; width: 168px; height: 168px; margin: 8px auto 24px; }
  .timer-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: var(--line); stroke-width: 6; }
  .ring { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
  .timer-text { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 38px; font-weight: 700; }
  .timer-wrap.low .ring { stroke: var(--danger); }
  .timer-wrap.low .timer-text { color: var(--danger); animation: pulse 1s infinite; }

  .card { perspective: 1200px; height: 280px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .card-inner { position: relative; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .card.revealed .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: var(--radius); border: 1px solid var(--line); padding: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .front { background: repeating-linear-gradient(45deg, #171d29 0 14px, #141922 14px 28px); }
  .front svg { width: 56px; height: 56px; color: var(--accent); margin-bottom: 14px; }
  .front .big { font-size: 22px; font-weight: 700; }
  .front .small { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .back { transform: rotateY(180deg); background: linear-gradient(160deg, #1d2534, #131821); }
  .back.spy { background: linear-gradient(160deg, #35121a, #150a0d); border-color: rgba(255,77,94,.5); }
  .back .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .back .value { font-size: 40px; font-weight: 700; margin: 8px 0; line-height: 1.1; }
  .back.spy .value { color: var(--danger); }
  .back .hint { color: var(--text); opacity: .85; font-size: 17px; }
  .back .tap { position: absolute; bottom: 14px; font-size: 12px; color: var(--muted); }

  .tips { color: var(--muted); text-align: center; font-size: 14px; margin: 20px 8px; line-height: 1.5; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: #fff; color: #111; padding: 12px 18px; border-radius: 12px; font-weight: 500;
    transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">

  <!-- START -->
  <div id="start" class="screen">
    <div class="brand">
      <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <div class="logo">SP<span>Y</span></div>
      <p class="tagline">A game by Axel Witsel Wienerschnitzel.</p>
    </div>

    <!-- Step 1: name -->
    <div id="stepName" class="panel step">
      <label class="label" for="name">What should we call you?</label>
      <input id="name" placeholder="Your name" maxlength="20" autocomplete="off" autofocus>
      <button class="btn btn-primary mt" onclick="saveName()">Continue</button>
    </div>

    <!-- Step 2: create or join -->
    <div id="stepChoice" class="step hidden">
      <div class="hello">
        Playing as <b id="helloName"></b>
        <button class="link" onclick="goStep('stepName')">Change</button>
      </div>
      <button class="choice" onclick="createGame()">
        <span class="choice-icon">+</span>
        <span class="choice-text"><b>Create game</b><small>Start a room and invite your friends</small></span>
        <span class="chev">›</span>
      </button>
      <button class="choice" onclick="goStep('stepJoin')">
        <span class="choice-icon">#</span>
        <span class="choice-text"><b>Join game</b><small>Enter a room code from a friend</small></span>
        <span class="chev">›</span>
      </button>
    </div>

    <!-- Step 3: room code -->
    <div id="stepJoin" class="panel step hidden">
      <label class="label" for="code">Room code</label>
      <input id="code" class="code-input" placeholder="ABCD" maxlength="4" autocomplete="off">
      <button class="btn btn-primary mt" onclick="joinGame()">Join game</button>
      <button class="btn btn-text mt" onclick="goStep('stepChoice')">Back</button>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="screen hidden">
    <div class="topbar">
      <div class="mini-logo">SP<span>Y</span></div>
      <button class="room-chip" onclick="copyCode()" title="Copy room code">
        <span class="lbl">Room</span>
        <span class="code" id="roomCode"></span>
        <span class="copy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></span>
      </button>
    </div>

    <div id="result" class="panel result hidden">
      <span class="label">Round over · the country was</span>
      <div class="country" id="resultCountry"></div>
      <span class="label" id="resultSpiesLabel">The spy was</span>
      <div class="pills" id="resultSpies"></div>
    </div>

    <div class="section-head">
      <span class="label">Players</span>
      <span class="count-pill" id="playerCount"></span>
    </div>
    <ul class="players" id="players"></ul>

    <div id="hostPanel" class="panel hidden">
      <div class="stepper">
        <div>
          <div class="title">Spies</div>
          <div class="sub">How many players are undercover</div>
        </div>
        <div class="ctrl">
          <button class="round-btn" id="minusBtn" onclick="changeSpies(-1)" aria-label="Fewer spies">−</button>
          <span class="num" id="spyCount">1</span>
          <button class="round-btn" id="plusBtn" onclick="changeSpies(1)" aria-label="More spies">+</button>
        </div>
      </div>
      <button class="btn btn-primary" id="playBtn" onclick="socket.emit('play')">Play</button>
      <div class="hint-line" id="playHint"></div>
    </div>

    <div id="waiting" class="panel waiting hidden">
      <span class="dot"></span>Waiting for the host to start
      <div class="hint-line" id="waitingSpies"></div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="screen hidden">
    <div class="topbar">
      <div class="mini-logo">SP<span>Y</span></div>
      <div class="room-chip" style="cursor:default">
        <span class="lbl">Room</span>
        <span class="code" id="roomCode2"></span>
        <span></span>
      </div>
    </div>

    <div class="timer-wrap" id="timerWrap">
      <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/><circle class="ring" id="ring" cx="60" cy="60" r="54"/></svg>
      <div class="timer-text" id="timer">5:00</div>
    </div>

    <div class="card" id="card" onclick="this.classList.toggle('revealed')">
      <div class="card-inner">
        <div class="face front">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 11c0 3.5-1 6.5-3 9"/><path d="M8.5 5.5A6 6 0 0 1 18 10.5c0 2.2-.3 4.3-.9 6.2"/><path d="M6 8.5a6 6 0 0 0-.5 2.5c0 2-.5 3.8-1.3 5.3"/><path d="M15 11c0 3-.6 5.8-1.7 8.2"/><path d="M9 11a3 3 0 0 1 6 0"/></svg>
          <div class="big">Tap to reveal</div>
          <div class="small">Make sure no one else can see your screen</div>
        </div>
        <div class="face back" id="cardBack"></div>
      </div>
    </div>

    <p class="tips" id="tips"></p>

    <button class="btn btn-danger hidden" id="cancelBtn" onclick="socket.emit('cancel')">End round</button>
    <button class="btn btn-primary hidden" id="revealBtn" onclick="socket.emit('reveal')">Reveal the spy</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const $ = (id) => document.getElementById(id);
  const C = 2 * Math.PI * 54;
  $("ring").style.strokeDasharray = C;

  let isHost = false, roundActive = false, timeUp = false, tick = null;
  let players = [], spies = 1, myName = "", roomCode = "";
  const seen = new Set();

  function show(screen) {
    ["start", "lobby", "game"].forEach((s) => $(s).classList.toggle("hidden", s !== screen));
  }
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove("show"), 2500);
  }
  function hue(str) {
    let h = 0;
    for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360;
    return h;
  }
  const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");

  function goStep(id) {
    ["stepName", "stepChoice", "stepJoin"].forEach((s) => $(s).classList.toggle("hidden", s !== id));
    const focus = { stepName: "name", stepJoin: "code" }[id];
    if (focus) setTimeout(() => $(focus).focus(), 50);
  }
  function saveName() {
    myName = $("name").value.trim();
    if (!myName) return toast("Enter your name first");
    try { localStorage.setItem("spyName", myName); } catch {}
    $("helloName").textContent = myName;
    goStep("stepChoice");
  }
  function createGame() {
    socket.emit("create", myName);
  }
  function joinGame() {
    const code = $("code").value.trim();
    if (code.length < 4) return toast("Enter the 4-character room code");
    socket.emit("join", { code, name: myName });
  }
  $("name").addEventListener("keydown", (e) => { if (e.key === "Enter") saveName(); });
  $("code").addEventListener("keydown", (e) => { if (e.key === "Enter") joinGame(); });

  // Remember the name from last time
  try {
    const saved = localStorage.getItem("spyName");
    if (saved) { $("name").value = saved; saveName(); }
  } catch {}

  async function copyCode() {
    try { await navigator.clipboard.writeText(roomCode); toast("Room code copied"); }
    catch { toast("Room code: " + roomCode); }
  }

  function changeSpies(d) {
    const max = Math.max(1, players.length - 1);
    const n = Math.min(max, Math.max(1, spies + d));
    if (n !== spies) socket.emit("setSpies", n);
  }

  function renderLobby() {
    $("playerCount").textContent = players.length;
    const ul = $("players");
    ul.innerHTML = "";
    players.forEach((p, i) => {
      const li = document.createElement("li");
      li.className = "player" + (p === myName ? " me" : "") + (seen.has(p) ? "" : " new");
      seen.add(p);
      const av = document.createElement("div");
      av.className = "avatar";
      av.style.background = `hsl(${hue(p)} 55% 42%)`;
      av.textContent = (p.trim()[0] || "?").toUpperCase();
      const info = document.createElement("div");
      info.className = "pinfo";
      const nm = document.createElement("div");
      nm.className = "pname";
      nm.textContent = p;
      info.appendChild(nm);
      if (i === 0 || p === myName) {
        const tag = document.createElement("div");
        tag.className = "tag";
        tag.textContent = [i === 0 ? "Host" : "", p === myName ? "You" : ""].filter(Boolean).join(" · ");
        info.appendChild(tag);
      }
      li.append(av, info);
      ul.appendChild(li);
    });

    $("spyCount").textContent = spies;
    $("minusBtn").disabled = spies <= 1;
    $("plusBtn").disabled = spies >= players.length - 1;

    const enough = players.length > spies;
    $("playBtn").disabled = !enough;
    $("playBtn").textContent = $("result").classList.contains("hidden") ? "Play" : "Play again";
    $("playHint").textContent = enough
      ? `${plural(players.length - spies, "agent")} vs ${plural(spies, "spy").replace("spys", "spies")}`
      : `Need at least ${spies + 1} players to start`;
    $("waitingSpies").textContent = plural(spies, "spy").replace("spys", "spies") + " this round";

    $("hostPanel").classList.toggle("hidden", !isHost);
    $("waiting").classList.toggle("hidden", isHost);
    $("cancelBtn").classList.toggle("hidden", !isHost || timeUp);
    $("revealBtn").classList.toggle("hidden", !isHost || !timeUp);
    $("tips").innerHTML = timeUp
      ? "<b>Time's up!</b><br>" + (isHost ? "Vote on who the spy is, then press reveal." : "Vote on who the spy is. The host will reveal the answer.")
      : "Take turns asking each other questions about the country.<br>Find the spy before time runs out.";
  }

  function startTimer(ms) {
    const end = Date.now() + ms;
    clearInterval(tick);
    const draw = () => {
      const left = Math.max(0, end - Date.now());
      const s = Math.ceil(left / 1000);
      $("timer").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      $("ring").style.strokeDashoffset = C * (1 - left / ms);
      $("timerWrap").classList.toggle("low", s <= 60);
    };
    draw();
    tick = setInterval(draw, 250);
  }

  socket.on("errorMsg", toast);
  socket.on("disconnect", () => toast("Connection lost. Refresh the page to rejoin."));

  socket.on("lobby", (d) => {
    players = d.players;
    spies = d.spies;
    roomCode = d.code;
    isHost = d.hostId === socket.id;
    $("roomCode").textContent = d.code;
    $("roomCode2").textContent = d.code;
    if (!roundActive) show("lobby");
    renderLobby();
  });

  socket.on("role", (r) => {
    roundActive = true;
    timeUp = false;
    const back = $("cardBack");
    back.className = "face back" + (r.spy ? " spy" : "");
    back.innerHTML = "";
    const add = (cls, text) => {
      const el = document.createElement("div");
      el.className = cls;
      el.textContent = text;
      back.appendChild(el);
    };
    if (r.spy) {
      add("kicker", "Your role");
      add("value", "You are the spy");
      add("hint", "Hint: " + r.hint);
    } else {
      add("kicker", "The country is");
      add("value", r.country);
      add("hint", "Find out who doesn't know it");
    }
    add("tap", "Tap to hide");
    $("card").classList.remove("revealed");
    $("result").classList.add("hidden");
    show("game");
    renderLobby();
    startTimer(r.ms);
  });

  socket.on("timeUp", () => {
    timeUp = true;
    clearInterval(tick);
    $("timer").textContent = "0:00";
    $("ring").style.strokeDashoffset = C;
    $("timerWrap").classList.add("low");
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    renderLobby();
  });

  socket.on("roundOver", (d) => {
    roundActive = false;
    timeUp = false;
    clearInterval(tick);
    $("resultCountry").textContent = d.country;
    $("resultSpiesLabel").textContent = d.spies.length === 1 ? "The spy was" : "The spies were";
    const box = $("resultSpies");
    box.innerHTML = "";
    d.spies.forEach((s) => {
      const p = document.createElement("span");
      p.className = "pill";
      p.textContent = s;
      box.appendChild(p);
    });
    $("result").classList.remove("hidden");
    show("lobby");
    renderLobby();
  });
</script>
</body>
</html>
